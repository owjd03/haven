name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# If two merges land close together, only the newest one deploys.
concurrency:
  group: deploy-hosting
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same checks every pull request has to pass, run again on the merged result.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    # The site's Firebase settings. They live in GitHub under Settings > Secrets and
    # variables > Actions > Secrets, because .env.local is not in the repo.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_CLOUD_MODEL: ${{ secrets.NEXT_PUBLIC_CLOUD_MODEL }}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the site's settings are present
        run: |
          for v in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID NEXT_PUBLIC_CLOUD_MODEL; do
            if [ -z "${!v}" ]; then
              echo "::error::The GitHub secret $v is missing (repo Settings > Secrets and variables > Actions > Secrets)."
              exit 1
            fi
          done

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAVEN_882C1 }}
          channelId: live
          projectId: haven-882c1
