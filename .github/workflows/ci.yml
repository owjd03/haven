name: CI

# Runs on every pull request, and is reused by the deploy workflow before each upload.
# It uses made-up Firebase settings, so no secret is involved and a pull request from a
# stranger's fork can't reach one.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web

  build:
    name: Build and safety checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-fake-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-fake.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-fake-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-fake.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1"
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-fake-app-id
      NEXT_PUBLIC_CLOUD_MODEL: gemini-3.5-flash-lite
      # A made-up debug token. The build must not copy it into the site (see the last step).
      NEXT_PUBLIC_APP_CHECK_DEBUG_TOKEN: ci-fake-debug-token-7f3a9c21
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - name: Check the built site for leaks and developer pages
        env:
          CHECK_DEBUG_TOKEN: ci-fake-debug-token-7f3a9c21
        run: node tools/ci/check-build-output.mjs
